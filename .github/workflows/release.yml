name: Build Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read package info
        id: package
        shell: bash
        run: |
          NAME=$(jq -r '.name' package.json)
          VERSION=$(jq -r '.version' package.json)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$NAME-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version ($VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Build VPM zip
        shell: bash
        run: |
          mkdir -p dist/package

          entries=(
            package.json
            package.json.meta
            README.md
            README.md.meta
            LICENSE
            LICENSE.meta
            icon.png
            icon.png.meta
            Core
            Core.meta
            YMArmPatch
            YMArmPatch.meta
            YMEyeFreeze
            YMEyeFreeze.meta
            YMFacialMapper
            YMFacialMapper.meta
            YMMToonToLilToon
            YMMToonToLilToon.meta
            YMMeshTrimmer
            YMMeshTrimmer.meta
            YMVRoidSkirtRefine
            YMVRoidSkirtRefine.meta
          )

          for entry in "${entries[@]}"; do
            if [ -e "$entry" ]; then
              cp -a "$entry" dist/package/
            fi
          done

          find dist/package -name ".DS_Store" -delete

          cd dist/package
          zip -r "../${{ steps.package.outputs.zip }}" . \
            -x "*.DS_Store" \
            -x "*.git*" \
            -x "**/Library/**" \
            -x "**/Temp/**" \
            -x "**/Obj/**" \
            -x "**/Logs/**" \
            -x "**/UserSettings/**"

      - name: Check zip root
        shell: bash
        run: |
          unzip -l "dist/${{ steps.package.outputs.zip }}"
          unzip -Z1 "dist/${{ steps.package.outputs.zip }}" > dist/zip-list.txt
          grep -Fxq "package.json" dist/zip-list.txt
          grep -Fxq "package.json.meta" dist/zip-list.txt
          grep -Fxq "Core/" dist/zip-list.txt
          grep -Fxq "YMArmPatch/" dist/zip-list.txt
          grep -Fxq "YMEyeFreeze/" dist/zip-list.txt
          grep -Fxq "YMFacialMapper/" dist/zip-list.txt
          grep -Fxq "YMMToonToLilToon/" dist/zip-list.txt
          grep -Fxq "YMMeshTrimmer/" dist/zip-list.txt
          grep -Fxq "YMVRoidSkirtRefine/" dist/zip-list.txt
          ! grep -q ".DS_Store" dist/zip-list.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.package.outputs.zip }}
          generate_release_notes: true
